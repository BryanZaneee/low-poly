<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Dreamy Low Poly Floating Islands with Player</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="messageBox" class="message-box"></div>

    <div class="controls-panel" id="sceneControlsPanel">
        <h3 id="controlsPanelHeader">Scene Controls <span id="toggleIcon">[-]</span></h3>
        <div id="controlsContent">
            <div>
                <label for="sunIntensity">Sun Intensity: <span id="sunIntensityValue" class="value-display">1.2</span></label>
                <input type="range" id="sunIntensity" min="0" max="3" step="0.1" value="1.2">
            </div>
            <div>
                <label for="ambientIntensity">Ambient Light: <span id="ambientIntensityValue" class="value-display">0.8</span></label>
                <input type="range" id="ambientIntensity" min="0" max="2" step="0.1" value="0.8">
            </div>
            <div>
                <label for="bobSpeed">Island 1 Bob: <span id="bobSpeedValue" class="value-display">0.4</span></label>
                <input type="range" id="bobSpeed" min="0" max="1.5" step="0.05" value="0.4">
            </div>
        </div>
    </div>

    <div class="controls-panel" id="devToolsPanel" style="top: 250px; /* Adjust as needed to not overlap */">
        <h3 id="devToolsHeader">Island Dev Tools <span id="devToolsToggleIcon">[-]</span></h3>
        <div id="devToolsContent">
            <div>
                <label for="timeOfDay">Time of Day: <span id="timeOfDayValue" class="value-display">0.5</span></label>
                <input type="range" id="timeOfDaySlider" min="0" max="1" step="0.01" value="0.5">
            </div>
            <!-- More dev tools will go here -->
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
